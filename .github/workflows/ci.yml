name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Eval cases and prompts (offline)
        run: pnpm eval --dry

  db-and-e2e:
    name: RLS tests and web e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,edge-runtime,storage-api,realtime
      - name: RLS policy tests (pgTAP)
        run: pnpm test:db
      - name: Serve edge functions (mock AI model)
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          nohup pnpm exec supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:54321/functions/v1/health && break
            sleep 2
          done
      - name: Install Playwright Chromium
        run: pnpm --filter mobile exec playwright install --with-deps chromium
      - name: Playwright e2e (web)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/mobile/test-results
          retention-days: 7
